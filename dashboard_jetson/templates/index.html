<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multisensor Surveillance System</title>
    <!-- Leaflet CSS y JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --border-color: #333;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --color-drone: #e74c3c;
            --color-bird: #2ecc71;
            --color-unknown: #95a5a6;
            --color-cyan: #00e5ff;
        }

        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Header */
        header { background-color: var(--panel-bg); padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--color-cyan); }
        .status-indicators { display: flex; gap: 20px; font-size: 14px; }
        .indicator span { font-weight: bold; }
        .online { color: var(--color-bird); }
        .offline { color: var(--color-drone); }

        /* Main Grid */
        .container { display: flex; flex: 1; overflow: hidden; }
        
        /* Panels */
        .panel { background-color: var(--panel-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .left-panel { width: 320px; overflow-y: auto; }
        .right-panel { width: 320px; border-right: none; border-left: 1px solid var(--border-color); overflow-y: auto; }
        .panel-header { padding: 10px 15px; background-color: #252525; border-bottom: 1px solid var(--border-color); font-size: 13px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; color: var(--text-muted); position: sticky; top: 0; z-index: 10; }
        .panel-content { padding: 15px; }

        /* Map */
        #map { flex: 1; background-color: #000; }

        /* Object Cards */
        .obj-card { background-color: #252525; border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; border-left: 4px solid var(--color-unknown); }
        .obj-card:hover { background-color: #2c2c2c; }
        .obj-card.drone { border-left-color: var(--color-drone); }
        .obj-card.bird { border-left-color: var(--color-bird); }
        .obj-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; font-size: 14px;}
        .obj-class { font-size: 11px; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        .obj-class.drone { background-color: rgba(231, 76, 60, 0.2); color: var(--color-drone); }
        .obj-class.bird { background-color: rgba(46, 204, 113, 0.2); color: var(--color-bird); }
        .obj-class.unknown { background-color: rgba(149, 165, 166, 0.2); color: var(--color-unknown); }
        .obj-details { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
        .obj-details strong { color: var(--text-main); }

        /* Event List */
        .event-item { font-size: 12px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .event-time { color: var(--text-muted); font-size: 11px; margin-bottom: 3px; }
        .event-body { display: flex; justify-content: space-between; }

        /* Sensor Display */
        .sensor-box { background: #1a1a1a; padding: 8px; border-radius: 4px; margin-top: 8px; font-family: monospace; font-size: 11px; color: var(--color-cyan); }
    </style>
</head>
<body>

    <header>
        <h1>Multisensor Surveillance System</h1>
        <div class="status-indicators">
            <div class="indicator">Broker MQTT: <span id="mqtt-status" class="offline">Desconectado</span></div>
            <div class="indicator">Objetos en Tracking: <span id="track-count">0</span></div>
        </div>
    </header>

    <div class="container">
        <!-- Panel Izquierdo: Objetos -->
        <div class="panel left-panel">
            <div class="panel-header">Objetos en Seguimiento</div>
            <div class="panel-content" id="objects-list">
                <!-- Se inyectan por JS -->
            </div>
        </div>

        <!-- Centro: Mapa -->
        <div id="map"></div>

        <!-- Panel Derecho: Eventos y Sensores -->
        <div class="panel right-panel">
            <div class="panel-header">Estado de Sensores (Último Objeto)</div>
            <div class="panel-content" id="sensor-panel">
                <div style="font-size: 12px; color: var(--text-muted);">Selecciona un objeto para ver telemetría.</div>
            </div>

            <div class="panel-header" style="margin-top: 10px;">Eventos Recientes</div>
            <div class="panel-content" id="events-list">
                <!-- Se inyectan por JS -->
            </div>
        </div>
    </div>

    <script>
        // 1. Inicializar Mapa (CartoDB Dark Matter para modo oscuro profesional)
        const latCenter = 7.128606;
        const lonCenter = -73.181549;
        const map = L.map('map').setView([latCenter, lonCenter], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // Perímetro
        L.circle([latCenter, lonCenter], {color: '#00e5ff', fillColor: '#00e5ff', fillOpacity: 0.05, radius: 125, weight: 1, dashArray: '4'}).addTo(map);
        L.marker([latCenter, lonCenter]).addTo(map).bindPopup("Estación Multisensor Base");

        // Diccionarios para elementos visuales
        const markers = {};
        const polylines = {};
        let selectedObjectId = null;

        // Factory de Iconos
        function getIcon(classification) {
            let color = 'var(--color-unknown)';
            if (classification === 'drone') color = 'var(--color-drone)';
            else if (classification === 'bird') color = 'var(--color-bird)';

            return L.divIcon({
                className: 'custom-div-icon',
                html: `<div style="background-color:${color}; width:12px; height:12px; border-radius:50%; border:2px solid #fff; box-shadow: 0 0 10px ${color};"></div>`,
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });
        }

        function formatTime(isoString) {
            if (!isoString) return "--:--:--";
            const d = new Date(isoString);
            return d.toLocaleTimeString();
        }

        function selectObject(objId) {
            selectedObjectId = objId;
            if(markers[objId]) {
                map.panTo(markers[objId].getLatLng());
                markers[objId].openPopup();
            }
        }

        // 2. Conexión WebSocket con FastAPI
        const wsUrl = `ws://${window.location.host}/ws`;
        let ws;

        function connectWS() {
            ws = new WebSocket(wsUrl);
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                // Actualizar Header
                const statusEl = document.getElementById('mqtt-status');
                statusEl.textContent = data.mqtt_status;
                statusEl.className = data.mqtt_status === 'Conectado' ? 'online' : 'offline';
                document.getElementById('track-count').textContent = Object.keys(data.objects).length;

                updateObjects(data.objects);
                updateEvents(data.events);
                updateSensorPanel(data.objects);
            };

            ws.onclose = () => {
                setTimeout(connectWS, 2000); // Autoreconectar
            };
        }

        function updateObjects(objects) {
            const listEl = document.getElementById('objects-list');
            listEl.innerHTML = '';

            for (const [objId, obj] of Object.entries(objects)) {
                // 1. Dibujar/Actualizar en Mapa
                if (obj.position) {
                    const latlng = [obj.position.lat, obj.position.lon];
                    
                    if (!markers[objId]) {
                        // Crear nuevo marcador y trayectoria
                        markers[objId] = L.marker(latlng, {icon: getIcon(obj.classification)}).addTo(map);
                        markers[objId].bindPopup(`<b>${objId}</b><br>${obj.classification.toUpperCase()}`);
                        
                        polylines[objId] = L.polyline(obj.trajectory, {color: obj.classification === 'drone' ? '#e74c3c' : (obj.classification === 'bird' ? '#2ecc71' : '#95a5a6'), weight: 2, opacity: 0.6, dashArray: '5'}).addTo(map);
                    } else {
                        // Actualizar existente
                        markers[objId].setLatLng(latlng);
                        markers[objId].setIcon(getIcon(obj.classification));
                        polylines[objId].setLatLngs(obj.trajectory);
                        polylines[objId].setStyle({color: obj.classification === 'drone' ? '#e74c3c' : (obj.classification === 'bird' ? '#2ecc71' : '#95a5a6')});
                    }
                }

                // 2. Renderizar Tarjeta en Lista
                const card = document.createElement('div');
                card.className = `obj-card ${obj.classification}`;
                card.onclick = () => selectObject(objId);
                
                card.innerHTML = `
                    <div class="obj-header">
                        <span>${objId}</span>
                        <span class="obj-class ${obj.classification}">${obj.classification}</span>
                    </div>
                    <div class="obj-details">
                        Último visto: <strong>${formatTime(obj.last_seen)}</strong><br>
                        Fuentes activas: <strong>${Object.keys(obj.sensors).join(', ')}</strong><br>
                        ${obj.position ? `Pos: ${obj.position.lat.toFixed(5)},${obj.position.lon.toFixed(5)}` : 'Posición: <i>Esperando medición...</i>'}
                    </div>
                `;
                listEl.appendChild(card);
            }
        }

        function updateSensorPanel(objects) {
            if (!selectedObjectId || !objects[selectedObjectId]) return;
            const obj = objects[selectedObjectId];
            const panel = document.getElementById('sensor-panel');
            
            let html = `<div style="margin-bottom: 10px;"><strong>Objetivo Activo:</strong> ${obj.object_id}</div>`;
            
            if(obj.measurements.rf) {
                html += `<div class="sensor-box">📡 [RF] Freq: ${obj.measurements.rf.frequency_mhz} MHz<br>RSSI: ${obj.measurements.rf.rssi_dbm} dBm</div>`;
            } else {
                html += `<div class="sensor-box" style="color:#666;">📡 [RF] No disponible</div>`;
            }

            if(obj.measurements.acoustic) {
                html += `<div class="sensor-box">🎙️ [AUDIO] SPL: ${obj.measurements.acoustic.spl_db} dB<br>Ruido Amb: ${obj.measurements.acoustic.ambient_noise_db} dB</div>`;
            } else {
                html += `<div class="sensor-box" style="color:#666;">🎙️ [AUDIO] No disponible</div>`;
            }
            
            panel.innerHTML = html;
        }

        function updateEvents(events) {
            const listEl = document.getElementById('events-list');
            listEl.innerHTML = '';
            
            events.forEach(ev => {
                const item = document.createElement('div');
                item.className = 'event-item';
                let color = ev.classification === 'drone' ? 'var(--color-drone)' : (ev.classification === 'bird' ? 'var(--color-bird)' : 'var(--color-unknown)');
                
                item.innerHTML = `
                    <div class="event-time">${formatTime(ev.timestamp)} vía [${ev.sensor.toUpperCase()}]</div>
                    <div class="event-body">
                        <strong>${ev.object_id}</strong>
                        <span style="color: ${color}; text-transform:uppercase; font-size:10px; font-weight:bold;">${ev.classification}</span>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        connectWS();
    </script>
</body>
</html>
