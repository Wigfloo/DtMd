<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#060d1f">
<title>SDR Drone Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#060d1f;--bg2:#0b1628;--surface:#0f1e36;--border:#162440;
  --green:#00ff9d;--green-dim:rgba(0,255,157,0.12);
  --red:#ff2d55;--red-dim:rgba(255,45,85,0.12);
  --amber:#ffb800;--cyan:#00d4ff;--text:#cde0ff;--muted:#3d5a8a;
  --font-mono:'Share Tech Mono',monospace;--font-hud:'Orbitron',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-mono);overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(0,212,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.025) 1px,transparent 1px);
  background-size:40px 40px}
.wrapper{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:16px 14px 32px;min-height:100vh;display:flex;flex-direction:column;gap:12px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px}
.hdr-title{font-family:var(--font-hud);font-size:0.62rem;font-weight:700;letter-spacing:0.15em;color:var(--cyan)}
.hdr-sub{font-size:0.58rem;color:var(--muted);margin-top:2px}
.ws-dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background 0.4s,box-shadow 0.4s}
.ws-dot.on{background:var(--green);box-shadow:0 0 10px var(--green)}.ws-dot.off{background:var(--red)}
.card-estado{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:20px 18px;text-align:center;transition:border-color 0.4s,background 0.4s}
.card-estado.seguro{border-color:var(--green);background:linear-gradient(160deg,var(--surface),var(--green-dim))}
.card-estado.alerta{border-color:var(--red);background:linear-gradient(160deg,var(--surface),var(--red-dim));animation:pulso 1.1s ease-in-out infinite}
@keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(255,45,85,0.3)}50%{box-shadow:0 0 0 14px rgba(255,45,85,0)}}
.estado-label{font-family:var(--font-hud);font-size:0.58rem;letter-spacing:0.2em;color:var(--muted);margin-bottom:8px}
.estado-valor{font-family:var(--font-hud);font-size:1.6rem;font-weight:900;letter-spacing:0.05em;transition:color 0.3s;line-height:1.1}
.seguro .estado-valor{color:var(--green);text-shadow:0 0 20px rgba(0,255,157,0.4)}
.alerta .estado-valor{color:var(--red);text-shadow:0 0 20px rgba(255,45,85,0.6)}
.estado-sub{font-size:0.65rem;color:var(--muted);margin-top:6px}
.metricas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metrica{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.metrica-label{font-size:0.55rem;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.metrica-valor{font-family:var(--font-hud);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--cyan)}
.metrica-sub{font-size:0.58rem;color:var(--muted);margin-top:3px}
.score-track{height:5px;background:var(--border);border-radius:999px;margin-top:8px;overflow:hidden}
.score-fill{height:100%;border-radius:999px;background:var(--green);transition:width 0.15s ease,background 0.3s}
.card-fft{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.card-fft-label{font-size:0.55rem;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
canvas{width:100%;height:100px;display:block;border-radius:6px;background:#030810}
.fft-freqs{display:flex;justify-content:space-between;font-size:0.55rem;color:var(--muted);margin-top:4px}
/* ══ BOTONES ══ */
.botones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font-family:var(--font-hud);font-size:0.7rem;font-weight:700;letter-spacing:0.08em;border:none;border-radius:10px;padding:16px 10px;cursor:pointer;position:relative;overflow:hidden;transition:transform 0.1s,opacity 0.2s,box-shadow 0.2s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(0.96)}.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-alerta{background:linear-gradient(135deg,#7f0000,var(--red));color:#fff;border:1.5px solid var(--red);box-shadow:0 4px 20px rgba(255,45,85,0.25)}
.btn-calma{background:linear-gradient(135deg,#003d24,var(--green));color:#001a0e;border:1.5px solid var(--green);box-shadow:0 4px 20px rgba(0,255,157,0.15)}
.btn-icon{font-size:1.3rem;display:block;margin-bottom:4px}
/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:10px 20px;font-size:0.75rem;white-space:nowrap;transition:transform 0.3s cubic-bezier(.34,1.56,.64,1),opacity 0.3s;opacity:0;z-index:1000;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.ok{border-color:var(--green);color:var(--green)}.toast.err{border-color:var(--red);color:var(--red)}
.card-log{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.card-log-label{font-size:0.55rem;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
#log{height:110px;overflow-y:auto;font-size:0.65rem;line-height:1.9;color:var(--muted)}
#log .ev-alerta{color:var(--red)}#log .ev-calma{color:var(--green)}
#log .ev-sistema{color:var(--cyan)}#log .ev-tg{color:var(--amber)}
.footer{text-align:center;font-size:0.55rem;color:var(--muted);letter-spacing:0.08em}
</style>
</head>
<body>
<div class="wrapper">

  <header class="hdr">
    <div>
      <div class="hdr-title">SDR DRONE WATCH</div>
      <div class="hdr-sub" id="ws-status">Conectando…</div>
    </div>
    <div class="ws-dot off" id="dot-ws"></div>
  </header>

  <div class="card-estado seguro" id="card-estado">
    <div class="estado-label">ESTADO DEL ESPECTRO</div>
    <div class="estado-valor" id="estado-valor">CARGANDO…</div>
    <div class="estado-sub" id="estado-sub">Esperando datos del servidor</div>
  </div>

  <div class="metricas">
    <div class="metrica">
      <div class="metrica-label">Score</div>
      <div class="metrica-valor" id="m-score">0.00</div>
      <div class="score-track"><div class="score-fill" id="score-fill" style="width:0%"></div></div>
    </div>
    <div class="metrica">
      <div class="metrica-label">Líneas activas</div>
      <div class="metrica-valor" id="m-bins">0</div>
      <div class="metrica-sub" id="m-bins-sub">mín: 3</div>
    </div>
    <div class="metrica">
      <div class="metrica-label">Piso de ruido</div>
      <div class="metrica-valor" id="m-piso" style="font-size:0.95rem">—</div>
      <div class="metrica-sub">mediana espectral</div>
    </div>
    <div class="metrica">
      <div class="metrica-label">Bloques</div>
      <div class="metrica-valor" id="m-bloques">0</div>
      <div class="metrica-sub">procesados</div>
    </div>
  </div>

  <div class="card-fft">
    <div class="card-fft-label">Espectro en tiempo real</div>
    <canvas id="fft-canvas"></canvas>
    <div class="fft-freqs">
      <span id="freq-min">—</span>
      <span id="freq-fc">fc</span>
      <span id="freq-max">—</span>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       BOTONES DE ALERTA COMUNITARIA
       Las funciones enviarAlerta() y enviarCalma()
       hacen POST a /alerta y /calma en el servidor.
       El servidor reenvía el mensaje a Telegram.
  ═══════════════════════════════════════════ -->
  <div class="botones">
    <button class="btn btn-alerta" id="btn-alerta" onclick="enviarAlerta()">
      <span class="btn-icon">🚨</span>
      ALERTAR<br>COMUNIDAD
    </button>
    <button class="btn btn-calma" id="btn-calma" onclick="enviarCalma()">
      <span class="btn-icon">✅</span>
      SITUACIÓN<br>NORMALIZADA
    </button>
  </div>

  <div class="card-log">
    <div class="card-log-label">Registro de eventos</div>
    <div id="log"></div>
  </div>

  <div class="footer">HackRF One · 2.4 GHz ISM · FHSS Detection</div>
</div>

<div class="toast" id="toast"></div>

<script>
const FC_HZ=2_399_045_000,SR_HZ=10_000_000;
const FC_MHZ=(FC_HZ/1e6).toFixed(3);
const FMIN_MHZ=((FC_HZ-SR_HZ/2)/1e6).toFixed(1);
const FMAX_MHZ=((FC_HZ+SR_HZ/2)/1e6).toFixed(1);
document.getElementById('freq-min').textContent=FMIN_MHZ+' MHz';
document.getElementById('freq-fc').textContent=FC_MHZ+' MHz';
document.getElementById('freq-max').textContent=FMAX_MHZ+' MHz';

const canvas=document.getElementById('fft-canvas');
const ctx=canvas.getContext('2d');

function dibujarFFT(fftNorm){
  const W=canvas.offsetWidth||380,H=100;
  canvas.width=W;canvas.height=H;
  ctx.fillStyle='#030810';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,212,255,0.06)';ctx.lineWidth=1;
  for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(0,H*i/4);ctx.lineTo(W,H*i/4);ctx.stroke()}
  const n=fftNorm.length;
  ctx.beginPath();ctx.moveTo(0,H);
  for(let i=0;i<n;i++){const x=(i/(n-1))*W,y=H-fftNorm[i]*(H-4)-2;ctx.lineTo(x,y)}
  ctx.lineTo(W,H);ctx.closePath();
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(0,212,255,0.85)');g.addColorStop(0.5,'rgba(0,212,255,0.3)');g.addColorStop(1,'rgba(0,212,255,0.03)');
  ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();
  for(let i=0;i<n;i++){const x=(i/(n-1))*W,y=H-fftNorm[i]*(H-4)-2;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
  ctx.strokeStyle='#00d4ff';ctx.lineWidth=1.5;ctx.stroke();
}

let ultimaAlerta=null;
function actualizarUI(d){
  const alerta=d.alerta_activa;
  document.getElementById('card-estado').className='card-estado '+(alerta?'alerta':'seguro');
  document.getElementById('estado-valor').textContent=alerta?'DRON DETECTADO':'ESPECTRO SEGURO';
  document.getElementById('estado-sub').textContent=`Bloque #${d.n_bloques}  ·  Bins: ${d.bins_activos}`;
  const pct=Math.min(100,(d.score/d.score_max)*100);
  document.getElementById('m-score').textContent=d.score.toFixed(2);
  const fill=document.getElementById('score-fill');
  fill.style.width=pct+'%';
  fill.style.background=pct>60?'var(--red)':pct>30?'var(--amber)':'var(--green)';
  document.getElementById('m-bins').textContent=d.bins_activos;
  document.getElementById('m-bins-sub').textContent='mín: '+d.bins_min;
  document.getElementById('m-piso').textContent=d.piso_ruido.toFixed(5);
  document.getElementById('m-bloques').textContent=d.n_bloques.toLocaleString();
  if(d.fft_norm&&d.fft_norm.length)dibujarFFT(d.fft_norm);
  if(ultimaAlerta!==alerta){
    if(alerta)addLog('🚨 DRON DETECTADO — firma espectral multicanal','ev-alerta');
    else if(ultimaAlerta!==null)addLog('🟢 Espectro limpio — señal fuera de rango','ev-calma');
    ultimaAlerta=alerta;
  }
}

function addLog(msg,cls){
  const ts=new Date().toLocaleTimeString();
  const el=document.createElement('div');
  el.className=cls;el.textContent=`[${ts}]  ${msg}`;
  const log=document.getElementById('log');
  log.appendChild(el);log.scrollTop=log.scrollHeight;
  while(log.children.length>150)log.removeChild(log.firstChild);
}

let toastTimer;
function showToast(msg,tipo){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show '+tipo;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.className='toast'},3000);
}

// ══ BOTONES ══
async function enviarAlerta(){
  const btn=document.getElementById('btn-alerta');
  btn.disabled=true;btn.textContent='⏳ Enviando…';
  try{
    const r=await fetch('/alerta',{method:'POST'});
    const j=await r.json();
    if(j.status==='enviado'){showToast('✅ Alerta enviada por Telegram','ok');addLog('📤 Alerta comunitaria enviada a Telegram','ev-tg');}
    else{showToast('⚠️ Error al enviar — revisa el token','err');addLog('⚠️ Error Telegram: '+j.status,'ev-alerta');}
  }catch(e){showToast('❌ Sin conexión con el servidor','err');}
  setTimeout(()=>{btn.disabled=false;btn.innerHTML='<span class="btn-icon">🚨</span>ALERTAR<br>COMUNIDAD';},4000);
}

async function enviarCalma(){
  const btn=document.getElementById('btn-calma');
  btn.disabled=true;btn.textContent='⏳ Enviando…';
  try{
    const r=await fetch('/calma',{method:'POST'});
    const j=await r.json();
    if(j.status==='enviado'){showToast('✅ Aviso de calma enviado','ok');addLog('📤 Situación normalizada — mensaje a Telegram','ev-tg');}
    else{showToast('⚠️ Error al enviar — revisa el token','err');addLog('⚠️ Error Telegram: '+j.status,'ev-alerta');}
  }catch(e){showToast('❌ Sin conexión con el servidor','err');}
  setTimeout(()=>{btn.disabled=false;btn.innerHTML='<span class="btn-icon">✅</span>SITUACIÓN<br>NORMALIZADA';},4000);
}

// ══ WebSocket — misma URL que sirve el HTML ══
function conectar(){
  const proto=location.protocol==='https:'?'wss':'ws';
  const ws=new WebSocket(`${proto}://${location.host}/ws`);
  const dot=document.getElementById('dot-ws');
  const status=document.getElementById('ws-status');
  ws.onopen=()=>{dot.className='ws-dot on';status.textContent='Conectado · '+location.host;addLog('Conexión WebSocket establecida','ev-sistema')};
  ws.onmessage=(ev)=>{try{actualizarUI(JSON.parse(ev.data))}catch(e){console.error(e)}};
  ws.onclose=()=>{dot.className='ws-dot off';status.textContent='Desconectado — reintentando…';addLog('Conexión perdida. Reintentando en 3s…','ev-sistema');setTimeout(conectar,3000)};
  ws.onerror=()=>{status.textContent='Error WS — ¿está servidor.py corriendo?'};
}
conectar();
</script>
</body>
</html>
